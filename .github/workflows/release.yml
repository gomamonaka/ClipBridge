name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Install the verified Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          # Official version and publisher verification:
          # https://jrsoftware.org/isdl.php
          # https://jrsoftware.org/isdl-verify.php
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup-6.7.3'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'The Inno Setup download differs from the pinned official release digest.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw 'The official Inno Setup installer does not have a valid Authenticode signature.'
          }
          $publisher = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -cne 'Pyrsys B.V.') { throw 'Unexpected Inno Setup publisher.' }
          $install = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/PORTABLE=1', ('/DIR="' + $compilerDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          $compiler = Join-Path $compilerDirectory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'ISCC.exe was not installed.' }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, verify and create the private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must use vX.Y.Z.'
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $notes = Join-Path $PWD 'artifacts\release-notes.md'
          $lines = @(
            "ClipBridge $env:GITHUB_REF_NAME / Windows x64",
            '',
            '- Setup.exe: current-user installer.',
            '- win-x64.zip: portable build including the .NET runtime.',
            '- SHA256SUMS.txt: SHA-256 hashes of both downloads.',
            '',
            'This release was built from its tag after the core, transfer, native and WPF checks passed.',
            'Existing connection settings, snippets and history are kept when updating.'
          )
          [IO.File]::WriteAllLines($notes, $lines, [Text.UTF8Encoding]::new($false))
          .\scripts\release.ps1 -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY -NotesFile $notes -CompilerPath $env:INNO_COMPILER -GenerateNotes
